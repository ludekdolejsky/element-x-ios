settings:
  APP_DISPLAY_NAME: Element X Nitro
  APP_GROUP_IDENTIFIER: group.com.nitrovery.elementx
  BASE_BUNDLE_IDENTIFIER: com.nitrovery.elementx
  DEVELOPMENT_TEAM: 44QX7TX6DE
  IS_NITRO_BUILD: true
  NOTIFICATION_FILTERING_ENABLED: false
  NITRO_PUSH_GATEWAY_BASE_URL: https://push.nitrovery.com
  NITRO_CATCH_UP_BASE_URL: https://matrix-bot.nitrovery.com
  NITRO_REMINDER_BASE_URL: https://matrix-bot.nitrovery.com
  NITRO_TRANSCRIPTION_BASE_URL: https://matrix-bot.nitrovery.com

  # Nitro doesn't share data or credentials with Element Classic.
  CLASSIC_APP_GROUP_IDENTIFIER: ""
  CLASSIC_APP_KEYCHAIN_SERVICE_IDENTIFIER: ""
  CLASSIC_APP_KEYCHAIN_ACCESS_GROUP_IDENTIFIER: ""
  CLASSIC_APP_DEEP_LINK_URL: ""

targets:
  ElementX:
    info:
      properties:
        BGTaskSchedulerPermittedIdentifiers:REPLACE:
        - $(BASE_BUNDLE_IDENTIFIER).background.refresh
        isNitroBuild: $(IS_NITRO_BUILD)
        nitroPushGatewayBaseURL: $(NITRO_PUSH_GATEWAY_BASE_URL)
        nitroCatchUpBaseURL: $(NITRO_CATCH_UP_BASE_URL)
        nitroReminderBaseURL: $(NITRO_REMINDER_BASE_URL)
        nitroTranscriptionBaseURL: $(NITRO_TRANSCRIPTION_BASE_URL)
    entitlements:
      properties:REPLACE:
        aps-environment: development
        com.apple.developer.usernotifications.communication: true
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
        - $(APP_GROUP_IDENTIFIER)
        com.apple.security.network.client: true
        keychain-access-groups:
        - $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)

  NSE:
    info:
      properties:
        isNitroBuild: $(IS_NITRO_BUILD)
        notificationFilteringEnabled: $(NOTIFICATION_FILTERING_ENABLED)
    entitlements:
      properties:REPLACE:
        com.apple.security.application-groups:
        - $(APP_GROUP_IDENTIFIER)
        keychain-access-groups:
        - $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)
